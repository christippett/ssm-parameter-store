name: Publish
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/ssm-parameter-store
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set dynamic version
        run: |
          # Format: YY.M.n where n increments
          PREFIX=$(date +'%y.%-m')

          # Find latest tag matching this prefix
          LATEST_TAG=$(git tag -l "v$PREFIX.*" --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="${PREFIX}.0"
          else
            # Extract the 'n' part and increment
            CURRENT_N=$(echo $LATEST_TAG | awk -F. '{print $3}')
            NEW_VERSION="${PREFIX}.$((CURRENT_N + 1))"
          fi

          echo "Setting version to: $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Update pyproject.toml version
          uv version "$NEW_VERSION"
      - name: Generate coverage
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: uv run --frozen pytest --cov=ssm_parameter_store --cov-report=lcov
      
      - name: Upload coverage data to coveralls.io
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Push version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit the pyproject.toml version bump
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ env.VERSION }} [skip ci]"
          git push origin master
          
          # Tag and push
          git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
